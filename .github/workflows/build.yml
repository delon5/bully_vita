name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  vpk:
    runs-on: ubuntu-latest

    env:
      # The loader calls into the game's Android .so, so every object in the
      # build has to use the soft-float calling convention. VitaSDK publishes a
      # toolchain and package set for exactly this; the stock hard-float one
      # cannot link these objects at all.
      VITASDK_CHANNEL: nightly-softfp
      # The revision this port was written and released against. Two things
      # since then break it outright: glShaderBinary now expects vitaGL's own
      # serialized shader-cache format rather than a raw GXP, which is what the
      # .gxp files in gamefiles are; and vglEnableRuntimeShaderCompiler is gone,
      # so vglInit always loads SceShaccCg and patches it through taiHEN. Do not
      # bump this without checking both.
      VITAGL_REV: 4e4f5b6ad0bf43754935250a1707fad67eb4e450

    steps:
      - uses: actions/checkout@v4

      - name: Install VitaSDK
        run: |
          curl -sSLO https://raw.githubusercontent.com/vitasdk/vdpm/master/bootstrap-vitasdk.sh
          chmod +x bootstrap-vitasdk.sh
          ./bootstrap-vitasdk.sh --install-dir "$HOME/vitasdk"
          echo "VITASDK=$HOME/vitasdk" >> "$GITHUB_ENV"
          echo "$HOME/vitasdk/bin" >> "$GITHUB_PATH"

      - name: Install prebuilt dependencies
        run: VDPM_NONINTERACTIVE=1 vdpm install libmathneon mpg123 openal-soft kubridge taihen SceShaccCgExt vitaShaRK

      # Built from source rather than taken from the package set, because the
      # port depends on compile-time options (unpure textures, phycont on
      # demand) the published package does not set. The overridden CC demotes
      # two diagnostics GCC 14 promoted to errors: this is 2022 code that was
      # written and tested under the older default, so demoting them preserves
      # its behaviour rather than changing it.
      - name: Build vitaGL
        run: |
          git clone https://github.com/Rinnegatamante/vitaGL
          git -C vitaGL checkout --detach "$VITAGL_REV"
          make -C vitaGL \
            CC="arm-vita-eabi-gcc -Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration -Wno-error=int-conversion" \
            SOFTFP_ABI=1 UNPURE_TEXTURES=1 PHYCONT_ON_DEMAND=1 -j"$(nproc)" install

      # Runs before the vpk so a logic regression fails fast, and after vitaGL
      # so the tests see the same headers the vpk is built against.
      - name: Run texture cache tests
        run: make -C tests check

      - name: Build SceLibcBridge stubs
        run: make -C libc_bridge install

      - name: Build Bully.vpk
        run: |
          cmake -B build -S .
          cmake --build build -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: Bully.vpk
          path: build/Bully.vpk
          if-no-files-found: error
