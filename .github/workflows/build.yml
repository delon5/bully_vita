name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  vpk:
    runs-on: ubuntu-latest

    env:
      # The loader calls into the game's Android .so, so every object in the
      # build has to use the soft-float calling convention. VitaSDK publishes a
      # toolchain and package set for exactly this; the stock hard-float one
      # cannot link these objects at all.
      VITASDK_CHANNEL: nightly-softfp
      # The revision this port was written and released against. Two things
      # since then break it outright: glShaderBinary now expects vitaGL's own
      # serialized shader-cache format rather than a raw GXP, which is what the
      # .gxp files in gamefiles are; and vglEnableRuntimeShaderCompiler is gone,
      # so vglInit always loads SceShaccCg and patches it through taiHEN. Do not
      # bump this without checking both.
      VITAGL_REV: 4e4f5b6ad0bf43754935250a1707fad67eb4e450
      OPENAL_REV: c851a68f0939040a56bf0dd453367c1021264bb9

    steps:
      - uses: actions/checkout@v4

      - name: Install VitaSDK
        run: |
          curl -sSLO https://raw.githubusercontent.com/vitasdk/vdpm/master/bootstrap-vitasdk.sh
          chmod +x bootstrap-vitasdk.sh
          ./bootstrap-vitasdk.sh --install-dir "$HOME/vitasdk"
          echo "VITASDK=$HOME/vitasdk" >> "$GITHUB_ENV"
          echo "$HOME/vitasdk/bin" >> "$GITHUB_PATH"

      - name: Install prebuilt dependencies
        run: VDPM_NONINTERACTIVE=1 vdpm install libmathneon mpg123 kubridge taihen SceShaccCgExt vitaShaRK

      # Built from source rather than taken from the package set, because the
      # port depends on compile-time options (unpure textures, phycont on
      # demand) the published package does not set. The overridden CC demotes
      # two diagnostics GCC 14 promoted to errors: this is 2022 code that was
      # written and tested under the older default, so demoting them preserves
      # its behaviour rather than changing it.
      - name: Build vitaGL
        run: |
          git clone https://github.com/Rinnegatamante/vitaGL
          git -C vitaGL checkout --detach "$VITAGL_REV"
          # vitaGL's Makefile finishes with "ar -rc libvitaGL.a ...", and -r
          # replaces or adds members without ever removing the ones that are no
          # longer built. An archive left over from a different revision keeps
          # its stale objects and they get linked alongside the new ones: the
          # file lists differ enough between revisions (vertex_buffers.o and
          # math_utils.o on one side, buffers.o and display_lists.o on the
          # other) that the result is two incompatible versions of vitaGL in
          # one binary. It links, sceGxm accepts every call, and nothing is
          # ever drawn. Delete both copies first so the archive can only ever
          # hold what this build produced.
          rm -f vitaGL/libvitaGL.a "$VITASDK/arm-vita-eabi/lib/libvitaGL.a"
          # NOT SOFTFP_ABI=1. That option exists for building vitaGL softfp against
          # a hardfp SDK: it swaps sceGxmSetViewport for a hand written shim that
          # moves the float arguments from r1-r3 into s0-s5. Against the softfp
          # SDK this port requires, they are already there, so the shim moves
          # them a second time and the viewport is garbage. Every primitive is
          # then clipped away -- draws succeed, no GL error is set, and the
          # screen stays black, including a plain glClear, since vitaGL sets the
          # viewport before drawing its clear quad. -mfloat-abi=softfp still
          # applies, it comes from the SDK.
          make -C vitaGL \
            CC="arm-vita-eabi-gcc -mfloat-abi=softfp -Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration -Wno-error=int-conversion" \
            UNPURE_TEXTURES=1 PHYCONT_ON_DEMAND=1 NO_SPLASHSCREEN=1 \
            HAVE_SHADER_CACHE=1 \
            -j"$(nproc)" install
          # Fail loudly rather than silently shipping a mixed archive.
          if arm-vita-eabi-ar t "$VITASDK/arm-vita-eabi/lib/libvitaGL.a" | grep -qx 'buffers.o'; then
            echo "libvitaGL.a contains objects from another vitaGL revision" >&2
            exit 1
          fi

      # Runs before the vpk so a logic regression fails fast, and after vitaGL
      # so the tests see the same headers the vpk is built against.
      - name: Run texture cache tests
        run: make -C tests check

      # openal-soft declares aluVector and aluMatrixf alignas(16), but reaches
      # them through sret slots derived from SP -- and AAPCS only guarantees SP
      # is 8-byte aligned. The compiler is then entitled to emit a 16-byte
      # aligned NEON store to an 8-byte aligned address, which is a data abort.
      # Whether it does depends on frame layout, so this is luck, not a setting:
      # the 2021 build happened to survive it and a current one does not.
      # Asking for 8 costs nothing here and makes the store legal either way.
      - name: Build openal-soft
        run: |
          git clone -b vita-1.19.1 https://github.com/isage/openal-soft
          git -C openal-soft checkout --detach "$OPENAL_REV"
          grep -rl 'alignas(16)' --include=*.h --include=*.c openal-soft | xargs sed -i 's/alignas(16)/alignas(8)/g'
          cmake -S openal-soft -B openal-soft/build \
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-mfloat-abi=softfp -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-pointer-types"
          cmake --build openal-soft/build -j"$(nproc)" --target install

      - name: Build SceLibcBridge stubs
        run: make -C libc_bridge install

      - name: Build Bully.vpk
        run: |
          cmake -B build -S .
          cmake --build build -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: Bully.vpk
          path: build/Bully.vpk
          if-no-files-found: error
