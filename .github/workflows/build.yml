name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  vpk:
    runs-on: ubuntu-latest

    env:
      # The loader calls into the game's Android .so, so every object in the
      # build has to use the soft-float calling convention. VitaSDK publishes a
      # toolchain and package set for exactly this; the stock hard-float one
      # cannot link these objects at all.
      VITASDK_CHANNEL: nightly-softfp
      # Pinned so a build that passed keeps passing. vitaGL in particular moves
      # quickly and has already renamed things this loader uses. To take a newer
      # one, bump these and fix whatever it breaks in the same commit.
      VITAGL_REV: cd3791e29ff7f1c0ab349f12c7231f4871ce6a75
      VITASHARK_REV: df24065e65098b2d1ac533760109ad4367573f28

    steps:
      - uses: actions/checkout@v4

      - name: Install VitaSDK
        run: |
          curl -sSLO https://raw.githubusercontent.com/vitasdk/vdpm/master/bootstrap-vitasdk.sh
          chmod +x bootstrap-vitasdk.sh
          ./bootstrap-vitasdk.sh --install-dir "$HOME/vitasdk"
          echo "VITASDK=$HOME/vitasdk" >> "$GITHUB_ENV"
          echo "$HOME/vitasdk/bin" >> "$GITHUB_PATH"

      - name: Install prebuilt dependencies
        run: VDPM_NONINTERACTIVE=1 vdpm install libmathneon mpg123 openal-soft kubridge taihen SceShaccCgExt

      # vitaGL needs a newer vitaShaRK than the published package, and both have
      # to be built here anyway: the port depends on vitaGL compile-time options
      # (unpure textures, phycont on demand) that the prebuilt package does not
      # set.
      - name: Build vitaShaRK
        run: |
          git clone https://github.com/Rinnegatamante/vitaShaRK
          git -C vitaShaRK checkout --detach "$VITASHARK_REV"
          make -C vitaShaRK SOFTFP_ABI=1 install

      - name: Build vitaGL
        run: |
          git clone https://github.com/Rinnegatamante/vitaGL
          git -C vitaGL checkout --detach "$VITAGL_REV"
          make -C vitaGL SOFTFP_ABI=1 UNPURE_TEXTURES=1 PHYCONT_ON_DEMAND=1 -j"$(nproc)" install

      # Runs before the vpk so a logic regression fails fast, and after vitaGL
      # so the tests see the same headers the vpk is built against.
      - name: Run texture cache tests
        run: make -C tests check

      - name: Build SceLibcBridge stubs
        run: make -C libc_bridge install

      - name: Build Bully.vpk
        run: |
          cmake -B build -S .
          cmake --build build -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: Bully.vpk
          path: build/Bully.vpk
          if-no-files-found: error
